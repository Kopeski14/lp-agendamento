<style>
  :root {
    --primary:        #000000;
    --primary-mid:    #1C1C1C;
    --primary-light:  #3A3630;
    --primary-pale:   #E4D3A8;
    --primary-deep:   #0A0A0A;
    --primary-darker: #000000;

    --cta:            #C2A674;
    --cta-light:      #D9C296;
    --cta-glow:       rgba(194, 166, 116, 0.35);

    --ink:            #000000;
    --ink-soft:       #0B0B0B;
    --cream:          #F5F1E6;
    --cream-dim:      rgba(245, 241, 230, 0.80);
    --cream-faint:    rgba(245, 241, 230, 0.45);
    --cream-ghost:    rgba(245, 241, 230, 0.14);

    --serif: 'Bodoni Moda', Georgia, serif;
    --sans:  'Jost', -apple-system, sans-serif;
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: var(--ink);
    color: var(--cream);
    font-family: var(--sans);
    overflow: hidden;
    height: 100vh;
    height: 100dvh;
    width: 100%;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ===== FUNDO ===== */
  .bg-base {
    position: fixed;
    inset: 0;
    z-index: 0;
    background:
      radial-gradient(ellipse 80% 50% at 50% -5%,  var(--primary-mid) 0%, transparent 62%),
      radial-gradient(ellipse 60% 45% at 50% 105%, var(--primary-mid) 0%, transparent 58%),
      linear-gradient(178deg, #000000 0%, #0A0A0A 50%, #000000 100%);
  }

  .bg-grid {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background-image:
      linear-gradient(rgba(245, 241, 230, 0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(245, 241, 230, 0.02) 1px, transparent 1px);
    background-size: 72px 72px;
    mask-image: radial-gradient(ellipse at center, black 25%, transparent 76%);
    -webkit-mask-image: radial-gradient(ellipse at center, black 25%, transparent 76%);
  }

  .bg-glow-gold {
    position: fixed;
    z-index: 1;
    pointer-events: none;
    width: 520px;
    height: 300px;
    border-radius: 50%;
    filter: blur(100px);
    background: var(--cta);
    opacity: 0.08;
    top: 46%;
    left: 50%;
    transform: translate(-50%, -50%);
  }

  .bg-glow-side {
    position: fixed;
    z-index: 1;
    pointer-events: none;
    width: 640px;
    height: 640px;
    border-radius: 50%;
    filter: blur(130px);
    background: var(--primary-light);
    opacity: 0.16;
    top: -220px;
    right: -180px;
  }

  .bg-grain {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    opacity: 0.05;
    mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' /%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' /%3E%3C/svg%3E");
  }

  .bg-vignette {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 42%, rgba(0,0,0,0.6) 100%);
  }

  /* ===== LAYOUT ===== */
  .stage {
    position: relative;
    z-index: 10;
    height: 100vh;
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(16px, 3.5vh, 40px) clamp(20px, 5vw, 40px);
  }

  .frame {
    width: 100%;
    max-width: 860px;
    position: relative;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .corner {
    position: absolute;
    width: clamp(22px, 2.8vw, 34px);
    height: clamp(22px, 2.8vw, 34px);
    border-color: rgba(194, 166, 116, 0.3);
    border-style: solid;
    opacity: 0;
    animation: fadeIn 1s 2.2s ease forwards;
  }

  .corner-tl { top: clamp(-14px,-1.5vw,-8px); left: clamp(-14px,-1.5vw,-8px); border-width: 1px 0 0 1px; }
  .corner-tr { top: clamp(-14px,-1.5vw,-8px); right: clamp(-14px,-1.5vw,-8px); border-width: 1px 1px 0 0; }
  .corner-bl { bottom: clamp(-14px,-1.5vw,-8px); left: clamp(-14px,-1.5vw,-8px); border-width: 0 0 1px 1px; }
  .corner-br { bottom: clamp(-14px,-1.5vw,-8px); right: clamp(-14px,-1.5vw,-8px); border-width: 0 1px 1px 0; }

  .rule-top, .rule-bottom {
    position: absolute;
    left: 10%;
    right: 10%;
    height: 1px;
    background: linear-gradient(to right, transparent, rgba(194,166,116,0.24), transparent);
    opacity: 0;
    animation: fadeIn 1s 2.4s ease forwards;
  }

  .rule-top    { top: clamp(-22px,-2.2vw,-12px); }
  .rule-bottom { bottom: clamp(-22px,-2.2vw,-12px); }

  /* ===== SELO ===== */
  .insignia {
    width: clamp(58px, 8.5vh, 86px);
    height: clamp(58px, 8.5vh, 86px);
    margin-bottom: clamp(34px, 5.5vh, 58px);
    position: relative;
    opacity: 0;
    animation: rise 1.2s 0.15s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  .insignia-shape {
    position: absolute;
    inset: 0;
    background: linear-gradient(145deg, #262626 0%, #0A0A0A 62%, #000000 100%);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow:
      0 0 0 1px rgba(194, 166, 116, 0.35),
      0 18px 46px -8px rgba(0, 0, 0, 0.7),
      inset 0 1px 0 rgba(245, 241, 230, 0.10),
      inset 0 -14px 26px rgba(0,0,0,0.4);
  }

  .insignia-inner-ring {
    position: absolute;
    inset: 6px;
    border-radius: 50%;
    border: 1px solid rgba(194, 166, 116, 0.22);
  }

  .insignia-check {
    width: 34%;
    height: 34%;
    stroke: var(--cta-light);
    stroke-width: 1.6;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 50;
    stroke-dashoffset: 50;
    animation: drawCheck 1.3s 0.85s cubic-bezier(0.65, 0, 0.35, 1) forwards;
    position: relative;
    z-index: 2;
  }

  @keyframes drawCheck { to { stroke-dashoffset: 0; } }

  /* ===== LOURO — assinatura visual (Winners Club) ===== */
  .laurel {
    position: absolute;
    bottom: 4%;
    width: clamp(20px, 3vh, 30px);
    height: clamp(54px, 8vh, 78px);
    color: var(--cta);
    opacity: 0;
    filter: drop-shadow(0 0 5px var(--cta-glow));
    animation: laurelRise 1.3s 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  .laurel-left  { left: -52%; }
  .laurel-right { right: -52%; transform: scaleX(-1); }

  .laurel svg { width: 100%; height: 100%; display: block; }
  .laurel path.stem { fill: none; stroke: currentColor; stroke-width: 1; opacity: 0.55; }
  .laurel ellipse { fill: currentColor; }

  @keyframes laurelRise {
    from { opacity: 0; transform: translateY(10px) scale(0.9); }
    to   { opacity: 0.8; transform: translateY(0) scale(1); }
  }

  .laurel-right.laurel { animation-name: laurelRiseFlip; }
  @keyframes laurelRiseFlip {
    from { opacity: 0; transform: scaleX(-1) translateY(10px) scale(0.9); }
    to   { opacity: 0.8; transform: scaleX(-1) translateY(0) scale(1); }
  }

  /* ===== HEADLINE ===== */
  .headline {
    font-family: var(--serif);
    font-weight: 400;
    font-style: normal;
    font-size: clamp(32px, 6.4vh, 76px);
    line-height: 1.04;
    letter-spacing: -0.01em;
    color: var(--cream);
    margin-bottom: clamp(6px, 1vh, 12px);
    opacity: 0;
    animation: rise 1.2s 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  .headline em {
    font-style: italic;
    font-weight: 400;
    color: var(--primary-pale);
    display: block;
    margin-top: 4px;
  }

  /* ===== DIVISOR — diamonds ===== */
  .ornament-divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(10px, 2vw, 18px);
    margin: clamp(20px, 3.2vh, 34px) auto clamp(20px, 3.2vh, 34px);
    opacity: 0;
    animation: rise 0.9s 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  .ornament-divider .line {
    width: clamp(36px, 6vw, 68px);
    height: 1px;
    background: linear-gradient(to right, transparent, rgba(194,166,116,0.38), transparent);
  }

  .ornament-divider .diamond-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .ornament-divider .diamond {
    width: 5px;
    height: 5px;
    background: var(--cta);
    transform: rotate(45deg);
    opacity: 0.75;
    box-shadow: 0 0 8px var(--cta-glow);
  }

  .ornament-divider .diamond.sm {
    width: 3px;
    height: 3px;
    opacity: 0.4;
  }

  /* ===== BODY ===== */
  .body {
    font-family: var(--serif);
    font-style: normal;
    font-weight: 400;
    font-size: clamp(16px, 2.3vh, 22px);
    line-height: 1.5;
    color: var(--cream-dim);
    max-width: 600px;
    margin-bottom: clamp(30px, 4.8vh, 50px);
    opacity: 0;
    animation: rise 1.1s 1.15s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  .body em {
    font-style: normal;
    color: var(--cream);
    font-weight: 700;
  }

  .body .accent {
    font-style: normal;
    color: var(--primary-pale);
  }

  /* ===== CTA ===== */
  .cta-block {
    opacity: 0;
    animation: rise 1s 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .cta-prefix {
    font-family: var(--sans);
    font-size: clamp(10px, 1.15vw, 12px);
    font-weight: 400;
    color: var(--cream-faint);
    text-transform: uppercase;
    letter-spacing: 0.26em;
    margin-bottom: clamp(14px, 2.1vh, 22px);
    max-width: 480px;
  }

  .cta {
    display: inline-flex;
    align-items: center;
    gap: clamp(12px, 1.5vw, 16px);
    padding: clamp(14px, 2.1vh, 20px) clamp(28px, 4vw, 44px);
    background: linear-gradient(135deg, var(--cta) 0%, var(--cta-light) 100%);
    color: var(--ink);
    text-decoration: none;
    font-family: var(--sans);
    font-size: clamp(12px, 1.35vw, 14px);
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    border-radius: 2px;
    position: relative;
    overflow: hidden;
    box-shadow:
      0 20px 55px -10px rgba(194, 166, 116, 0.4),
      0 0 0 1px rgba(194, 166, 116, 0.25),
      inset 0 1px 0 rgba(255, 255, 255, 0.3);
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s ease;
    cursor: pointer;
    white-space: nowrap;
  }

  .cta::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, transparent 30%, rgba(255,255,255,0.28) 50%, transparent 70%);
    transform: translateX(-100%);
    transition: transform 0.65s ease;
  }

  .cta:hover {
    transform: translateY(-2px);
    box-shadow:
      0 28px 65px -10px rgba(194, 166, 116, 0.58),
      0 0 0 1px rgba(194, 166, 116, 0.4),
      inset 0 1px 0 rgba(255,255,255,0.4);
  }

  .cta:hover::before { transform: translateX(100%); }

  .cta-icon {
    width: clamp(16px, 2vw, 20px);
    height: clamp(16px, 2vw, 20px);
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    stroke: var(--ink);
  }

  .cta-arrow {
    width: clamp(13px, 1.5vw, 16px);
    height: clamp(13px, 1.5vw, 16px);
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    stroke: var(--ink);
  }

  .cta:hover .cta-icon  { transform: rotate(-6deg) scale(1.1); }
  .cta:hover .cta-arrow { transform: translateX(5px); }

  /* ===== ANIMAÇÕES ===== */
  @keyframes rise {
    from { opacity: 0; transform: translateY(22px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  /* ===== MOBILE ===== */
  @media (max-width: 720px) {
    .stage { padding: 20px 18px; }

    .corner { width: 18px; height: 18px; }
    .corner-tl { top: -10px; left: -10px; }
    .corner-tr { top: -10px; right: -10px; }
    .corner-bl { bottom: -10px; left: -10px; }
    .corner-br { bottom: -10px; right: -10px; }
    .rule-top    { top: -16px; }
    .rule-bottom { bottom: -16px; }

    .insignia { width: 64px; height: 64px; margin-bottom: 32px; }
    .laurel { width: 18px; height: 48px; }
    .laurel-left  { left: -46%; }
    .laurel-right { right: -46%; }

    .headline { font-size: clamp(30px, 9.2vw, 44px); }

    .ornament-divider { margin: 18px auto; }

    .body { font-size: 17px; line-height: 1.45; margin-bottom: 30px; padding: 0 4px; }

    .cta-prefix { font-size: 10px; letter-spacing: 0.2em; margin-bottom: 16px; }
    .cta { padding: 15px 26px; font-size: 12px; }
  }

  /* Viewport curto */
  @media (max-height: 680px) and (min-width: 721px) {
    .insignia { width: 60px; height: 60px; margin-bottom: 24px; }
    .laurel { height: 46px; }
    .headline { font-size: clamp(30px, 5vh, 52px); }
    .ornament-divider { margin: 14px auto; }
    .body { font-size: clamp(15px, 2vh, 17px); margin-bottom: 26px; }
    .cta-prefix { margin-bottom: 12px; }
    .cta { padding: 14px 30px; }
  }

  @media (max-height: 580px) {
    .corner, .rule-top, .rule-bottom { display: none; }
    .laurel { display: none; }
    .ornament-divider { margin: 10px auto; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>

<div class="bg-base"></div>
<div class="bg-grid"></div>
<div class="bg-glow-gold"></div>
<div class="bg-glow-side"></div>
<div class="bg-grain"></div>
<div class="bg-vignette"></div>

<main class="stage">
  <div class="frame">

    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>
    <div class="rule-top"></div>
    <div class="rule-bottom"></div>

    <!-- Selo -->
    <div class="insignia">
      <div class="laurel laurel-left">
        <svg viewBox="0 0 30 90" xmlns="http://www.w3.org/2000/svg">
          <path class="stem" d="M15 88 C8 72, 6 45, 11 6" />
          <g transform="translate(13,78) rotate(-72)"><ellipse rx="6" ry="2.1" /></g>
          <g transform="translate(9,62) rotate(-58)"><ellipse rx="5.5" ry="2" /></g>
          <g transform="translate(7,44) rotate(-42)"><ellipse rx="5" ry="1.8" /></g>
          <g transform="translate(8,27) rotate(-28)"><ellipse rx="4.3" ry="1.6" /></g>
          <g transform="translate(10,12) rotate(-14)"><ellipse rx="3.4" ry="1.3" /></g>
        </svg>
      </div>
      <div class="laurel laurel-right">
        <svg viewBox="0 0 30 90" xmlns="http://www.w3.org/2000/svg">
          <path class="stem" d="M15 88 C8 72, 6 45, 11 6" />
          <g transform="translate(13,78) rotate(-72)"><ellipse rx="6" ry="2.1" /></g>
          <g transform="translate(9,62) rotate(-58)"><ellipse rx="5.5" ry="2" /></g>
          <g transform="translate(7,44) rotate(-42)"><ellipse rx="5" ry="1.8" /></g>
          <g transform="translate(8,27) rotate(-28)"><ellipse rx="4.3" ry="1.6" /></g>
          <g transform="translate(10,12) rotate(-14)"><ellipse rx="3.4" ry="1.3" /></g>
        </svg>
      </div>
      <div class="insignia-shape">
        <div class="insignia-inner-ring"></div>
        <svg class="insignia-check" viewBox="0 0 24 24">
          <path d="M5 12.5l4.5 4.5L19 7.5" />
        </svg>
      </div>
    </div>

    <!-- Headline -->
    <h1 class="headline">
      Agendamento realizado
      <em>com sucesso.</em>
    </h1>

    <!-- Divisor -->
    <div class="ornament-divider">
      <div class="line"></div>
      <div class="diamond-wrap">
        <div class="diamond sm"></div>
        <div class="diamond"></div>
        <div class="diamond sm"></div>
      </div>
      <div class="line"></div>
    </div>

    <!-- Body -->
    <p class="body">
      Enquanto isso, siga o <em>Winners Club</em> no Instagram para receber conteúdos que vão te preparar para <span class="accent">a nossa conversa</span>.
    </p>

    <!-- CTA -->
    <div class="cta-block">
      <p class="cta-prefix">Clique abaixo para acompanhar os bastidores do Winners Club</p>
      <a href="https://www.instagram.com/winnerscluboficial_/" class="cta" target="_blank" rel="noopener">
        <svg class="cta-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="5" ry="5"></rect>
          <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
          <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
        </svg>
        <span>Seguir o Winners Club no Instagram</span>
        <svg class="cta-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </a>
    </div>

  </div>
</main>

</body>
</html>
